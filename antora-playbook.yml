# Dev Center docs — CI/production (dev-centr repos only)
# Standard name: antora-playbook.yml.
# Local sibling checkouts: antora-playbook-local.yml. Local UI bundle: antora-playbook.testing.yml.
site:
  title: Dev-Centr Docs
  url: https://docs.devcentr.org
  start_page: home::index.adoc
  keys:
    header_logo: logo.svg
    site_home_url: https://devcentr.org
    site_home_label: DevCentr home
    header_doc_title: DevCentr Docs
antora:
  extensions:
    - '@antora/lunr-extension'
content:
  sources:
    - url: https://github.com/dev-centr/docs.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/devcentr.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/templates.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/general-knowledge.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/business-bootstrap.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/infra-template.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/msi-generator.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/easy-installer.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/agentic-email-integration.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/issues-browser.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/agent-rules.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/ver.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/fixnow-dev.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/switchyard.git
      branches: HEAD
      start_path: docs
ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v2/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui
output:
  dir: ./build/site
