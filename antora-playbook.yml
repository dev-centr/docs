# DevCentr Docs — CI/production (dev-centr repos only)
# Standard name: antora-playbook.yml.
# Local sibling checkouts: antora-playbook-local.yml. Local UI bundle: antora-playbook.testing.yml.
site:
  title: Dev-Centr Docs
  url: https://docs.devcentr.org
  robots: |
    User-agent: *
    Allow: /
    Sitemap: https://docs.devcentr.org/sitemap.xml
  start_page: home::index.adoc
  keys:
    header_logo: logo.svg
    site_home_url: https://devcentr.org
    site_home_label: DevCentr home
    header_doc_title: DevCentr Docs
    nav_typology_diataxis: 'true'
# Folder URLs: index.adoc → …/email/ (not …/email/index.html); canonical + sitemap follow this.
urls:
  html_extension_style: indexify
antora:
  extensions:
    # Local dark-mode SVG guard (not part of the compose pack).
    - ./lib/verify-themed-svg-dark-mode.js
    # Compose pack: footer lists "facto-stack" once (hub profile; members are not listed individually).
    - require: '@antora-supplemental/facto-stack'
      profile: hub
      siteNavTree:
        enabled: true
        # Curated forest roots only - wiring a product source is not a sidebar root.
        include:
          - home
          - general-knowledge
          - business-bootstrap
          - platforms
          - tools
          - templates
        order:
          - home
          - general-knowledge
          - business-bootstrap
          - platforms
          - tools
          - templates
      linkValidator:
        # Hub CI reliability: lower concurrency, longer timeout, capped report history
        # (see .antora-link-suppressions.yml); failLevel stays none via pack defaults.
        concurrency: 6
        timeoutMs: 15000
        reportHistoryLimit: 5
        cacheEnabled: true
        cachePath: .link-check-cache.json
      navTypology:
        # BB capability URLs use /how-to|tutorials|.../ as tree folders, not Diataxis buckets.
        diataxisUrlExcludePrefixes:
          - /business-bootstrap/
      searchChat:
        # Floating bottom dock (results open upward); top bar keeps brand + actions only.
        placement: dock
      softNavPageToc:
        injectScript: false
      mermaidClient:
        enabled: true
      diagramLightbox:
        enabled: true
