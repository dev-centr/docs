# Local Kroki for Antora builds (Mermaid needs the companion container).
# Usage: docker compose -f docker-compose.kroki.yml up -d
#        pnpm build   # antora-playbook.yml (local Kroki URL in attributes when needed)
# Tear down: docker compose -f docker-compose.kroki.yml down
services:
  kroki:
    image: yuzutech/kroki:latest
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      KROKI_MERMAID_HOST: mermaid
    depends_on:
      - mermaid
  mermaid:
    image: yuzutech/kroki-mermaid:latest
