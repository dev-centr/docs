# Local UI / theme testing — same sibling content as antora-playbook-local.yml,
# but uses a local valentus-theme UI bundle. Build the theme first, then:
#   pnpm build:testing
site:
  title: Dev Center Docs (Local Test)
  url: https://docs.devcentr.org
  start_page: home::index.adoc
  keys:
    header_logo: logo.svg
    site_home_url: https://devcentr.org
    site_home_label: DevCentr home
    header_doc_title: DevCentr Docs
urls:
  html_extension_style: indexify
antora:
  extensions:
    - '@antora/lunr-extension'
    - require: '@antora-supplemental/site-nav-tree'
      include:
        - home
        - general-knowledge
        - business-bootstrap
        - agent-rules
        - DevCentr
        - templates
        - devcentr-org
      order:
        - home
        - general-knowledge
        - business-bootstrap
        - agent-rules
        - DevCentr
        - templates
        - devcentr-org
    - require: '@antora-supplemental/nav-typology'
    - require: '@antora-supplemental/nav-typology-diataxis'
content:
  sources:
    - url: .
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../devcentr
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../devcentr.org
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../templates
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../general-knowledge
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../business-bootstrap
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../msi-generator
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../easy-installer
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../agentic-email-integration
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../issues-browser
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../repo-drive
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../agent-rules
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../rules-manager
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../ver
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../fixnow-dev
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../switchyard
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../scriptbook
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../equivalence-engine
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../uniconfig
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../toolchain-framework
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../infra-template
      branches: HEAD
      start_path: docs
      worktrees: true
ui:
  bundle:
    url: ../valentus-theme/build/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui
output:
  dir: ./build/site

asciidoc:
  extensions:
    - asciidoctor-kroki
    - '@antora-supplemental/page-context'
  attributes:
    stem: latexmath
    kroki-server-url: https://kroki.io
    kroki-fetch-diagram: true
    page-context-active: ''
