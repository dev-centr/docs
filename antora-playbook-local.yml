# Local build — sibling content sources under ../ (same layout as this org checkout)
# Run: pnpm build
site:
  title: Dev Center Docs (Local)
  url: https://docs.devcentr.org
  start_page: home::index.adoc
  keys:
    header_logo: logo.svg
    site_home_url: https://devcentr.org
    site_home_label: DevCentr home
    header_doc_title: DevCentr Docs
antora:
  extensions:
    - '@antora/lunr-extension'
content:
  sources:
    - url: .
      branches: HEAD
      start_path: docs
      worktrees: true
