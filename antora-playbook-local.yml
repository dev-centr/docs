# Local build — sibling content sources under ../ (same layout as this org checkout)
# Run: pnpm build
site:
  title: Dev Center Docs (Local)
  url: https://docs.devcentr.org
  start_page: home::index.adoc
  keys:
    header_logo: logo.svg
    site_home_url: https://devcentr.org
    site_home_label: DevCentr home
    header_doc_title: DevCentr Docs
antora:
  extensions:
    - '@antora/lunr-extension'
content:
  sources:
    - url: .
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../devcentr
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../templates
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../general-knowledge
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: ../msi-generator
      branches: HEAD
      start_path: docs
      worktrees: true
ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v2.0.0/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui
output:
  dir: ./build/site
