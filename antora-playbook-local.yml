ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v2/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui
output:
  dir: ./build/site

asciidoc:
  extensions:
    - asciidoctor-kroki
    - '@antora-supplemental/page-context'
  attributes:
    stem: latexmath
    # Local gateway+mermaid: docker compose -f docker-compose.kroki.yml up -d
    # Override to public if needed: antora --attribute kroki-server-url=https://kroki.io antora-playbook-local.yml
    kroki-server-url: http://127.0.0.1:8000
    kroki-fetch-diagram: true
    page-context-active: ''
    page-context-keyword-base: '/home/keywords'
