name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [extension-updated, link-cache-invalidate]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve dispatch checkout ref
        if: github.event_name == 'repository_dispatch'
        id: dispatch_ref
        run: |
          ref="${{ github.event.client_payload.ref }}"
          if [ -z "$ref" ]; then
            ref="main"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Log content-source dispatch
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "repository_dispatch action=${{ github.event.action }}"
          echo "source=${{ github.event.client_payload.source }} sha=${{ github.event.client_payload.sha }}"

      - name: Resolve link-cache-invalidate env
        if: github.event_name == 'repository_dispatch' && github.event.action == 'link-cache-invalidate'
        id: link_invalidate
        env:
          RAW_SOURCES: ${{ toJSON(github.event.client_payload.sources) }}
          RAW_URLS: ${{ toJSON(github.event.client_payload.urls) }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const out = process.env.GITHUB_OUTPUT;
          function csv(raw) {
            if (raw === undefined || raw === null || raw === '' || raw === 'null') return '';
            let v;
            try {
              v = JSON.parse(raw);
            } catch {
              v = raw;
            }
            if (Array.isArray(v)) return v.map(String).filter(Boolean).join(',');
            return String(v);
          }
          const sources = csv(process.env.RAW_SOURCES);
          const urls = csv(process.env.RAW_URLS);
          fs.appendFileSync(out, `sources=${sources}\n`);
          fs.appendFileSync(out, `urls=${urls}\n`);
          NODE

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'repository_dispatch' && steps.dispatch_ref.outputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Kroki (same compose as local)
        run: docker compose -f docker-compose.kroki.yml up -d

      - name: Wait for Kroki
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null \
              && curl -sf -X POST http://127.0.0.1:8000/mermaid/svg \
                   -H 'Content-Type: text/plain' \
                   --data 'graph TD; A-->B' >/dev/null; then
              echo "Kroki + Mermaid are up"
              exit 0
            fi
            sleep 2
          done
          echo "Kroki/Mermaid failed to become healthy" >&2
          docker compose -f docker-compose.kroki.yml logs || true
          exit 1

      - name: Restore link check cache
        uses: actions/cache@v4
        with:
          path: .link-check-cache.json
          key: link-check-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.antora-link-suppressions.yml') }}
          restore-keys: |
            link-check-cache-${{ runner.os }}-

      - name: Build Antora site
        id: antora
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINK_VALIDATOR_INVALIDATE_SOURCES: ${{ steps.link_invalidate.outputs.sources }}
          LINK_VALIDATOR_INVALIDATE_URLS: ${{ steps.link_invalidate.outputs.urls }}
        uses: antora-supplemental/antora-build-action@v3
        with:
          playbook: antora-playbook.yml
          output_dir: build/site
          install_dependencies: false
          setup_pnpm: false
          setup_node: false
          fetch: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.antora.outputs.site-path }}

  deploy:
    if: >
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
