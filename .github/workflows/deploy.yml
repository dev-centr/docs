name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [extension-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Kroki (same compose as local)
        run: docker compose -f docker-compose.kroki.yml up -d

      - name: Wait for Kroki
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null \
              && curl -sf -X POST http://127.0.0.1:8000/mermaid/svg \
                   -H 'Content-Type: text/plain' \
                   --data 'graph TD; A-->B' >/dev/null; then
              echo "Kroki + Mermaid are up"
              exit 0
            fi
            sleep 2
          done
          echo "Kroki/Mermaid failed to become healthy" >&2
          docker compose -f docker-compose.kroki.yml logs || true
          exit 1

      - name: Build Antora site
        id: antora
        uses: antora-supplemental/antora-build-action@v2
        with:
          playbook: antora-playbook.yml
          output_dir: build/site
          install_dependencies: false
          setup_pnpm: false
          setup_node: false
          fetch: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.antora.outputs.site-path }}

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
