# Dev Center docs — CI/production (dev-centr repos only)
# Standard name: antora-playbook.yml.
# Local sibling checkouts: antora-playbook-local.yml. Local UI bundle: antora-playbook.testing.yml.
site:
  title: Dev-Centr Docs
  url: https://docs.devcentr.org
  robots: |
    User-agent: *
    Allow: /
    Sitemap: https://docs.devcentr.org/sitemap.xml
  start_page: home::index.adoc
  keys:
    header_logo: logo.svg
    site_home_url: https://devcentr.org
    site_home_label: DevCentr home
    header_doc_title: DevCentr Docs
    nav_typology_diataxis: 'true'
# Folder URLs: index.adoc → …/email/ (not …/email/index.html); canonical + sitemap follow this.
urls:
  html_extension_style: indexify
antora:
  extensions:
    - '@antora/lunr-extension'
    - require: '@antora-supplemental/site-nav-tree'
      # Curated forest roots only — wiring a product source ≠ sidebar root.
      include:
        - home
        - general-knowledge
        - business-bootstrap
        - DevCentr
        - templates
        - devcentr-org
      order:
        - home
        - general-knowledge
        - business-bootstrap
        - DevCentr
        - templates
        - devcentr-org
    - require: '@antora-supplemental/nav-typology'
    - require: '@antora-supplemental/nav-typology-diataxis'
    - '@antora-supplemental/build-stack'
    - '@antora-supplemental/page-edit'
    - require: '@antora-supplemental/page-context/antora'
      component: home
      path: keywords
    - require: '@antora-supplemental/mermaid-client/antora'
      # CDN default; injectAssets false — hub supplemental-ui owns chrome (package Asciidoctor still runs)
      injectAssets: false
    - require: '@antora-supplemental/diagram-lightbox'
      injectAssets: false
content:
  sources:
    - url: .
      branches: HEAD
      start_path: docs
    - url: .
      branches: HEAD
      start_path: tools-docs
    - url: ../siblings/DevCentr
      branches: HEAD
      start_path: docs
    - url: ../siblings/devcentr.org
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/themed-svg-studio.git
      branches: HEAD
      start_path: docs
    - url: ../siblings/templates
      branches: HEAD
      start_path: docs
    - url: ../siblings/general-knowledge
      branches: HEAD
      start_path: docs
    - url: ../siblings/business-bootstrap
      branches: HEAD
      start_path: docs
    - url: ../siblings/infra-template
      branches: HEAD
      start_path: docs
    - url: ../siblings/msi-generator
      branches: HEAD
      start_path: docs
    - url: ../siblings/ibex-install-builder
      branches: HEAD
      start_path: docs
    - url: ../siblings/install-coordinator
      branches: HEAD
      start_path: docs
      worktrees: true
    - url: https://github.com/dev-centr/agentic-email-integration.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/issues-browser.git
      branches: HEAD
      start_path: docs
    - url: ../siblings/repo-drive
      branches: HEAD
      start_path: docs
    - url: ../siblings/agent-rules
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/rules-manager.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/ver.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/fixnow-dev.git
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/switchyard.git
      branches: HEAD
      start_path: docs
    - url: ../siblings/scriptbook
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/equivalence-engine.git
      branches: HEAD
      start_path: docs
    - url: ../siblings/uniconfig
      branches: HEAD
      start_path: docs
    - url: https://github.com/dev-centr/uniprovider.git
      branches: HEAD
      start_path: docs
    - url: ../siblings/binary-tailor
      branches: HEAD
      start_path: docs
    - url: ../siblings/macho-memload
      branches: HEAD
      start_path: docs
    - url: ../siblings/polyglot-debug
      branches: HEAD
      start_path: docs
    - url: ../siblings/toolchain-framework
      branches: HEAD
      start_path: docs
ui:
  bundle:
    url: https://github.com/antora-supplemental/valentus-theme/releases/download/v2/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui
output:
  dir: ./build/site

asciidoc:
  extensions:
    - asciidoctor-kroki
    - '@antora-supplemental/page-context'
  attributes:
    stem: latexmath
    kroki-server-url: http://127.0.0.1:8000
    kroki-fetch-diagram: true
    mermaid-client: ''
    mermaid-client-mode: client
    # PlantUML / non-Mermaid still bake via Kroki; Mermaid listings become client hosts
    page-context-active: ''
    page-context-keyword-base: '/home/keywords'
